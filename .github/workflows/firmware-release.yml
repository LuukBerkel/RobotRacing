name: Firmware Release Build

on:
  release:
    types: [published]
    
permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: RobotRacingFirmware

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Prepare firmware package
        run: |
          mkdir -p dist

          cp .pio/build/esp32cam/bootloader.bin dist/
          cp .pio/build/esp32cam/partitions.bin dist/
          cp .pio/build/esp32cam/firmware.bin dist/

          echo "bootloader.bin 0x1000" > dist/flash.txt
          echo "partitions.bin 0x8000" >> dist/flash.txt
          echo "firmware.bin 0x10000" >> dist/flash.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.event.release.tag_name }}
          path: dist/*

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            dist/bootloader.bin \
            dist/partitions.bin \
            dist/firmware.bin \
            dist/flash.txt \
            --clobber