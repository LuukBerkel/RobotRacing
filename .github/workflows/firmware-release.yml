name: Firmware Release Build

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: RobotRacingFirmware

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Prepare firmware package
        run: |
          mkdir -p dist

          cp .pio/build/esp32cam/bootloader.bin dist/
          cp .pio/build/esp32cam/partitions.bin dist/
          cp .pio/build/esp32cam/firmware.bin dist/

          echo "bootloader.bin 0x1000" > dist/flash.txt
          echo "partitions.bin 0x8000" >> dist/flash.txt
          echo "firmware.bin 0x10000" >> dist/flash.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.event.release.tag_name }}
          path: RobotRacingFirmware/dist/*

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: Release ${{ github.event.release.tag_name }}
          files: |
            RobotRacingFirmware/dist/bootloader.bin
            RobotRacingFirmware/dist/partitions.bin
            RobotRacingFirmware/dist/firmware.bin
            RobotRacingFirmware/dist/flash.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}